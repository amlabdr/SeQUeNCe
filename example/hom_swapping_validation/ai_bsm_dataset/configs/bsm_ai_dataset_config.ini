[generation]
dataset_name = bsm_ai_dataset_60s_10k_blackbird ; output folder name under ai_bsm_dataset/generated
dataset_size = 10000 ; total episodes; each episode gets a random fault label
episode_duration_s = 60.0 ; simulated monitoring duration per episode
window_duration_s = 1.0 ; one BSM feature row per monitoring window
base_seed = 91000 ; deterministic seed base; each episode/window derives unique seeds
workers = 1 ; local worker processes
write_raw_streams = false ; true writes raw BSM streams/histograms; can be large
resume = true ; reuse existing checkpoints in the same output directory

[setup]
setup_id = bsm_reference_40km ; stable reference setup identifier
source_frequency_hz = 80000000.0 ; SPDC pulse repetition rate
mean_photon_num = 0.01 ; baseline mean pair number per pulse for both sources
source_bandwidth_nm = 0.1 ; source bandwidth used for wavelength sampling and HOM overlap
lambda_a_nm = 1550.0 ; Source A signal center wavelength
lambda_b_nm = 1550.0 ; Source B signal center wavelength
lambda_idler_a_nm = 1550.0 ; Source A idler center wavelength
lambda_idler_b_nm = 1550.0 ; Source B idler center wavelength
photon_statistics = thermal ; thermal or poisson
use_sparse_emission = true ; statistically skip empty pulses for speed while preserving distribution
bell_state_a = psi- ; Bell state emitted by Source A
bell_state_b = psi- ; Bell state emitted by Source B
arm_length_m_a = 20000.0 ; Source A signal fiber to BSM
arm_length_m_b = 20000.0 ; Source B signal fiber to BSM
herald_length_m_a = 1.0 ; idler sink fiber length; not detected in BSM-only mode
herald_length_m_b = 1.0 ; idler sink fiber length; not detected in BSM-only mode
attenuation_db_per_m = 0.0002 ; 0.2 dB/km baseline fiber attenuation
baseline_raman_power_mw = 0.02 ; normal weak classical coexistence/Raman baseline on both signal arms
detector_eff_bsm = 0.95 ; BSM detector efficiency
detector_jitter_ps = 20 ; BSM detector timing jitter
detector_dark_hz_bsm = 50 ; BSM detector dark count rate
hom_match_window_ps = 1200 ; internal HOM candidate matching window
emission_chunk_pulses = 25000 ; SPDC scheduling chunk size

[histogram]
range_ps = 5000 ; BSM1-BSM2 lag histogram range, +/- value
bin_width_ps = 20 ; lag histogram bin width
coincidence_window_ps = 120 ; BSM twofold coincidence window

[faults]
temperature_shift_c_min = 0.0 ; temperature drift target range applied to one signal fiber
temperature_shift_c_max = 40.0

polarization_twist_rad_per_m_min = 0.02 ; mechanical stress/twist target range
polarization_twist_rad_per_m_max = 0.20
polarization_bend_radius_m_min = 0.05 ; smaller radius means stronger bend
polarization_bend_radius_m_max = 0.50

spectral_detuning_nm_min = 0.05 ; source detuning target range
spectral_detuning_nm_max = 0.40

raman_power_mw_min = 0.02 ; extra classical coexistence power target range above baseline
raman_power_mw_max = 0.50

attenuation_extra_db_per_m_min = 0.00002 ; added loss target range for one BSM arm
attenuation_extra_db_per_m_max = 0.00020

source_brightness_factor_min = 0.20 ; faulty source brightness factor target range
source_brightness_factor_max = 0.75

sync_jitter_ps_min = 500.0 ; extra detector-clock jitter target range for sync_issue
sync_jitter_ps_max = 12000.0

source_clock_drift_ps_per_s_min = 50.0 ; source pulse-clock drift rate target range
source_clock_drift_ps_per_s_max = 2000.0

[slurm]
target = blackbird ; local or blackbird
host = blackbird.nist.gov ; SSH hostname for file copy; PuTTY commands use plink_profile
submit = false ; true submits through SSH, false only writes Slurm scripts
sync_project = true ; sync this repo to the cluster before submitting
remote_repo = auto ; auto uses $HOME/<repo-name> on the cluster
plink_profile = blackbird ; PuTTY saved session for Windows clients; blank uses ssh/scp
plink_user = ana35 ; PuTTY username; blank uses the saved-session/default user
plink_path = C:\Program Files\PuTTY\plink.exe
pscp_path = C:\Program Files\PuTTY\pscp.exe
output_dir =  ; empty means ai_bsm_dataset/generated/<dataset_name>
partition = batch ; Blackbird partition, leave blank if not needed
time_limit = 08:00:00 ; Blackbird job wall time limit
nodes = 32 ; concurrency cap planning; 32*316 is enough for 10000 array tasks
cpus_per_node = 316 ; effective worker CPUs per large Blackbird node
shards_per_node = 316 ; one single-CPU full-episode shard per allocated CPU
array_tasks = 10000 ; one full episode per Slurm array task
python_cmd = /home/ana35/.venvs/sequence-bsm/bin/python ; Python command on the cluster
module_load = miniforge ; module to load on Blackbird, blank if not needed
poll_seconds = 60 ; SSH polling interval when wait_for_completion=true
wait_for_completion = false ; wait for Slurm job completion from local machine
collect_outputs = false ; collect generated dataset back after completion
clean_old_logs = true ; remove old bsm_ai_*.out/.err before launch
