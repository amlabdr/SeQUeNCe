[batch]
target = enki ; possible: local or enki. Use local for workstation runs, enki for Slurm.
scan = all ; possible: all, temporal, polarization, spectral.
workers = 8 ; local-only worker count. On Enki, cpus_per_task controls workers per node.
runs_per_point = 10 ; Monte Carlo repeats for each scan point. Increase for lower std/error bars.
duration_s = 1 ; physical simulated duration per run in seconds. Pulses = duration_s * source_frequency_hz.
emission_chunk_pulses = 25000 ; SPDC emission scheduling chunk size. 25000 is the tested default.
seed = 42 ; base random seed. Each scan point/run derives a unique deterministic seed.

[scan]
temporal_half_range_ps = 800 ; delay scan range is [-value, +value] ps.
temporal_points = 31 ; number of temporal scan points.
polarization_points = 31 ; number of waveplate rotation scan points.
spectral_half_range_nm = 0.4 ; spectral detuning scan range is [-value, +value] nm.
spectral_points = 31 ; number of spectral detuning scan points.
rotate_arm = 1 ; possible: 0 or 1. Signal arm where waveplate rotation is applied.

[source]
source_frequency_hz = 80000000.0 ; source repetition rate in Hz.
mean_photon_num = 0.01 ; SPDC mean pair number per pulse. Higher gives more counts and more multipair noise.
source_bandwidth_nm = 0.04 ; source FWHM bandwidth in nm used for wavelength sampling and HOM overlap.
lambda_a_nm = 1550.0 ; Source A signal central wavelength in nm.
lambda_b_nm = 1550.0 ; Source B signal central wavelength in nm.
lambda_idler_a_nm = 1550.0 ; Source A idler central wavelength in nm.
lambda_idler_b_nm = 1550.0 ; Source B idler central wavelength in nm.
photon_statistics = thermal ; possible: thermal or poisson.
use_sparse_emission = true ; true skips empty SPDC pulses statistically; false schedules every pulse.
bell_state_a = psi- ; possible: psi-, psi+, phi-, phi+.
bell_state_b = psi- ; possible: psi-, psi+, phi-, phi+.

[fiber]
arm_length_m_a = 20000.0 ; Source A signal fiber length to HOM in meters.
arm_length_m_b = 20000.0 ; Source B signal fiber length to HOM in meters.
herald_length_m_a = 1.0 ; Source A idler/herald fiber length in meters.
herald_length_m_b = 1.0 ; Source B idler/herald fiber length in meters.
attenuation_db_per_m = 0.0002 ; fiber attenuation in dB/m. 0.0002 dB/m = 0.2 dB/km.

[detectors]
detector_eff_hom = 1.0 ; HOM detector efficiency in [0, 1].
detector_eff_herald = 1.0 ; herald detector efficiency in [0, 1].
detector_jitter_ps = 0.0 ; Gaussian detector timing jitter std in ps.
detector_dark_hz_hom = 0.0 ; HOM detector dark count rate in Hz.
detector_dark_hz_herald = 0.0 ; herald detector dark count rate in Hz.

[coincidence]
hom_match_window_ps = 1200 ; internal HOM pairing window for deciding candidate HOM pairs in ps.
hom_window_ps = 120 ; timestamp coincidence window for HOM1+HOM2 twofolds in ps.
hom_offset_ps = 0 ; fixed HOM timing offset in ps.
herald_window_ps = 300 ; timestamp window for matching herald detections to HOM events in ps.
herald_mode = hom_only ; possible: projected or hom_only. hom_only sends idlers to passive sinks and records only HOM-side observables.
herald_basis = Z ; used only when herald_mode=projected.
herald_channel_a = 0 ; possible: 0 or 1. Selected herald channel for Source A when needed.
herald_channel_b = 0 ; possible: 0 or 1. Selected herald channel for Source B when needed.
extra_overlap_scale = 1.0 ; unmodeled HOM overlap scale in [0, 1]. Keep 1.0 for component validation.

[enki]
host = enki ; SSH host alias for Enki.
remote_repo = auto ; auto syncs to $HOME/<repo-name> on Enki; absolute path also allowed.
submit = true ; true submits Slurm job from local script; false only writes/syncs scripts.
sync_project = true ; true ships current repo state to Enki before running.
wait_for_completion = true ; true polls Slurm until job exits.
collect_outputs = true ; true copies output CSVs/logs back after completion.
poll_seconds = 60 ; polling interval in seconds while waiting for Enki job.
install_missing_dependencies = true ; true attempts qutip dependency install on Enki if missing.
nodes = 9 ; Enki Slurm nodes to request.
cpus_per_task = 110 ; worker processes per Enki node.
python_cmd = python ; Python command used on Enki after module loading.

# Paths excluded when syncing project to Enki. Continuation lines are supported by INI.
sync_excludes =
    .git
    .venv
    venv
    __pycache__
    .pytest_cache
    .mypy_cache
    .ipynb_checkpoints
    example/hom_validation/results
