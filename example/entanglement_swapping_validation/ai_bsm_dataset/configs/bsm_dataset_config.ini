[generation]
dataset_name = polarization_bsm_60s
dataset_size = 10000
episode_duration_s = 60.0
window_duration_s = 1.0
fault_update_interval_s = 0.1
onset_min_fraction = 0
onset_max_fraction = 1
ramp_duration_min_s = 1.0
ramp_duration_max_s = 10.0
base_seed = 120000
workers = 1
resume = true
write_raw_streams = false

[setup]
setup_id = polarization_bsm_40km
source_frequency_hz = 100000000.0
mean_photon_num = 0.01
source_bandwidth_nm = 0.1
photon_statistics = thermal
use_sparse_emission = true
emission_chunk_pulses = 25000
bell_state_a = psi-
bell_state_b = psi-
signal_wavelength_nm_a = 1550.0
signal_wavelength_nm_b = 1550.0
sink_wavelength_nm_a = 1550.0
sink_wavelength_nm_b = 1550.0
signal_length_m_a = 20000.0
signal_length_m_b = 20000.0
attenuation_db_per_m = 0.0002
baseline_raman_power_mw = 0.02
detector_efficiency = 0.95
detector_jitter_ps = 20.0
detector_dark_hz = 50.0
matching_window_ps = 1200
coincidence_window_ps = 120
pbs_fidelity = 1.0
pbs_mismeasure_prob = 0.0

[features]
histogram_range_ps = 5000
histogram_bin_width_ps = 20

[faults]
temperature_shift_c_min = 0.0
temperature_shift_c_max = 35.0
polarization_twist_rad_per_m_min = 0.02
polarization_twist_rad_per_m_max = 0.20
polarization_bend_radius_m_min = 0.05
polarization_bend_radius_m_max = 0.50
spectral_detuning_nm_min = 0.01
spectral_detuning_nm_max = 0.20
raman_extra_power_mw_min = 0.02
raman_extra_power_mw_max = 0.50
attenuation_extra_db_per_m_min = 0.00002
attenuation_extra_db_per_m_max = 0.00020
source_brightness_factor_min = 0.20
source_brightness_factor_max = 0.75
sync_jitter_ps_min = 100.0
sync_jitter_ps_max = 5000.0
source_clock_drift_ps_per_s_min = 20.0
source_clock_drift_ps_per_s_max = 1000.0

[slurm]
target = blackbird
host = blackbird.nist.gov
submit = true
sync_project = true
remote_repo = auto
plink_profile = blackbird
plink_user = ana35
plink_path = C:\Program Files\PuTTY\plink.exe
pscp_path = C:\Program Files\PuTTY\pscp.exe
partition = batch
time_limit = 08:00:00
nodes = 9
cpus_per_node = 100
python_cmd = /home/ana35/.venvs/sequence-swapping/bin/python
module_load = miniforge
wait_for_completion = false
collect_outputs = false
poll_seconds = 60
