[simulation]
duration_s = 1.0 ; simulated time for each of the nine analyzer settings
source_frequency_hz = 100000000.0 ; SPDC pulse repetition rate
mean_photon_num = 0.01 ; mean pair number per pulse and source
source_bandwidth_nm = 0.0001 ; narrow validation bandwidth
photon_statistics = thermal
use_sparse_emission = true
emission_chunk_pulses = 25000
source_a_state = psi_minus
source_b_state = psi_minus
signal_wavelength_nm = 1550.0
outer_wavelength_nm = 1550.0
signal_length_a_m = 20000.0 ; source A to central BSM
signal_length_b_m = 20000.0 ; source B to central BSM
outer_length_a_m = 20010.0 ; includes storage/delay so BSM occurs first
outer_length_d_m = 20010.0
attenuation_db_per_m = 0.0002
detector_efficiency_bsm = 0.95
detector_efficiency_outer = 0.95
detector_dark_hz_bsm = 50.0
detector_dark_hz_outer = 50.0
detector_jitter_ps_bsm = 20.0
matching_window_ps = 1200
bsm_coincidence_window_ps = 120
fourfold_window_ps = 300
extra_overlap_scale = 1.0
seed = 11000

[batch]
experiment_name = full_swapping_validation
runs = 100
workers = 1
resume = true
output_dir = ; empty writes results/<experiment_name>

[slurm]
target = blackbird ; local or blackbird
host = blackbird.nist.gov
submit = true
sync_project = true
remote_repo = auto
plink_profile = blackbird
plink_user = ana35
plink_path = C:\Program Files\PuTTY\plink.exe
pscp_path = C:\Program Files\PuTTY\pscp.exe
partition = batch
time_limit = 08:00:00
nodes = 9
cpus_per_node = 100
python_cmd = /home/ana35/.venvs/sequence-swapping/bin/python
module_load = miniforge
wait_for_completion = false
collect_outputs = false
poll_seconds = 60
clean_old_logs = true
